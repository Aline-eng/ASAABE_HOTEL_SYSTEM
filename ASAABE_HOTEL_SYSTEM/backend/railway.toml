[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements.txt"

[deploy]
startCommand = "python manage.py migrate --noinput && python manage.py collectstatic --noinput && python init_production.py && gunicorn asaabe.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers 2 --timeout 120"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[healthcheck]
path = "/admin/"
interval = 30
timeout = 10
